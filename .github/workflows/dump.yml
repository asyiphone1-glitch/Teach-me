name: tmp-dump
on:
  push:
    branches: [tmp-dump-1711]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/dump.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - run: tar czf - out | base64 -w 0 | fold -w 4000 | sed 's/^/B64:/'
