# teach-me — 🔔 "יש לך חומר חדש!" (17.11.2026, אושר בישיבת צוות)
# רץ אחרי כל עדכון שעבר את רשת הביטחון, וגם כל שעה עגולה בין 07:00 ל-20:00 (שעון ישראל, חורף).
# שולח התראה רק לילדה שהחומר שלה. בלי קרדיט של Claude — GitHub Actions בחינם.
name: new-material
on:
  schedule:
    - cron: '7 5-18 * * *'
  workflow_dispatch:
  workflow_call:
concurrency:
  group: new-material
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3
      - run: node scripts/news.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
