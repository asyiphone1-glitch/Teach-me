# teach-me — 📊 סיכום שבועי להורים (17.11.2026 לילה, אושר בישיבת צוות)
# כל שישי ב-13:00 שעון ישראל. רץ ב-10:03 וב-11:03 UTC (חורף/קיץ) — הסקריפט שולח רק כשבישראל 13:00.
# רק לטלפונים של ההורים. בחינם — GitHub Actions.
name: weekly-parents
on:
  schedule:
    - cron: '3 10,11 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'לשלוח עכשיו (בדיקה)'
        required: false
        default: '0'
concurrency:
  group: weekly-parents
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3
      - name: Restore server sign-in
        run: git fetch -q --depth=1 origin tm-state && git show FETCH_HEAD:rt.enc > /tmp/tm-rt.enc || true
      - run: node scripts/weekly.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCE: ${{ github.event.inputs.force || '0' }}
      - name: Save server sign-in
        # עותק מוצפן של החיבור הקבוע של השרת, בענף נפרד (tm-state) כדי לא להפריע ל-dev/main
        if: always()
        run: |
          if [ -s /tmp/tm-rt.new ]; then
            d=$(mktemp -d); cp /tmp/tm-rt.new "$d/rt.enc"; cd "$d"
            git init -q && git add rt.enc
            git -c user.name=teach-me-bot -c user.email=teach-me-bot@users.noreply.github.com commit -qm "server sign-in (encrypted)"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:tm-state
          fi
