<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>לוח הכפל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ✖️ לוח הכפל לאביב (14.11.2026): 20 תרגילים בכל סבב — כפל 1–10 וחילוק הפוך עד 100 — עם ציון */
  :root{
    --paper:#FBF6EC; --card:#fff; --ink:#2E3A59; --soft:#5B6684; --line:#E7DFCC;
    --acc:#0B6F6B; --acc-soft:#DDF2F0; --ok:#2F9E5B; --ok-soft:#E3F5EA; --bad:#D9534F; --bad-soft:#FBE7E6;
    --warn:#B7791F; --warn-soft:#FFF4DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--paper);font-family:'Heebo',sans-serif;color:var(--ink);display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));}
  .scr{display:none;flex:1;flex-direction:column;min-height:0;}
  .scr.on{display:flex;}
  button{font-family:inherit;cursor:pointer;}

  /* פתיחה */
  .hi{text-align:center;margin-top:4vh;}
  .hi .big{font-size:3.4rem;line-height:1;}
  .hi h1{font-family:'Fredoka','Heebo',sans-serif;font-size:1.9rem;color:var(--acc);margin:10px 0 4px;}
  .hi p{margin:0;color:var(--soft);font-size:1.05rem;}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 18px;}
  .mode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:1rem;color:var(--ink);}
  .mode .ic{font-size:1.8rem;line-height:1;}
  .mode.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);}
  .go{width:100%;border:0;border-radius:20px;background:var(--acc);color:#fff;font-size:1.35rem;font-weight:800;padding:18px;box-shadow:0 4px 0 #06504D;}
  .go:active{transform:translateY(2px);box-shadow:0 2px 0 #06504D;}
  .best{text-align:center;margin-top:16px;color:var(--soft);font-size:.98rem;min-height:1.4em;}
  .best b{color:var(--acc);}
  .miss-note{text-align:center;margin-top:6px;color:var(--warn);font-size:.92rem;min-height:1.2em;}

  /* תרגיל */
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .cnt{font-weight:800;color:var(--acc);font-size:1rem;white-space:nowrap;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;flex:1;direction:rtl;}
  .dots i{width:10px;height:10px;border-radius:50%;background:#E5DCC8;display:block;}
  .dots i.now{background:var(--acc);transform:scale(1.25);}
  .dots i.ok{background:var(--ok);}
  .dots i.half{background:#E3B341;}
  .dots i.bad{background:var(--bad);}
  .qwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}
  .eq{direction:ltr;font-family:'Fredoka','Heebo',sans-serif;font-weight:700;font-size:clamp(2.6rem,13vw,3.8rem);color:var(--ink);display:flex;align-items:center;gap:.28em;white-space:nowrap;}
  .eq .op{color:var(--acc);}
  .ans{min-width:1.9em;height:1.25em;border:3px solid var(--line);border-radius:16px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;padding:0 .15em;color:var(--acc);}
  .ans.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);}
  .ans.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shk .35s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .fb{min-height:3.6em;margin-top:12px;text-align:center;font-size:1.08rem;font-weight:700;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .fb .why{direction:ltr;unicode-bidi:isolate;display:inline-block;}
  .fb.ok{color:var(--ok);} .fb.hint{color:var(--warn);} .fb.bad{color:var(--bad);}
  .fb small{font-weight:500;color:var(--soft);font-size:.95rem;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;direction:ltr;}
  .pad button{border:2px solid var(--line);background:var(--card);border-radius:16px;font-family:'Fredoka','Heebo',sans-serif;font-size:1.65rem;font-weight:600;color:var(--ink);height:clamp(50px,8.6vh,66px);box-shadow:0 3px 0 #E1D6BF;}
  .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #E1D6BF;}
  .pad .del{color:var(--soft);font-size:1.4rem;}
  .pad .chk{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 0 #06504D;font-size:1.5rem;}
  .pad .chk:disabled{opacity:.45;}
  .next{display:none;width:100%;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:1.25rem;font-weight:800;height:clamp(50px,8.6vh,66px);margin-top:9px;box-shadow:0 3px 0 #06504D;}
  .next.on{display:block;}

  /* סוף */
  .end{flex:1;overflow-y:auto;text-align:center;padding-top:2vh;}
  .ring{width:150px;height:150px;margin:0 auto;position:relative;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring .g{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .g b{font-family:'Fredoka','Heebo',sans-serif;font-size:2.9rem;line-height:1;color:var(--acc);}
  .ring .g span{font-size:.85rem;color:var(--soft);margin-top:2px;}
  .end h2{font-family:'Fredoka','Heebo',sans-serif;font-size:1.6rem;margin:12px 0 4px;color:var(--ink);}
  .stats{display:flex;justify-content:center;gap:10px;margin:12px 0;flex-wrap:wrap;}
  .stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.95rem;}
  .stats b{color:var(--acc);}
  .rev{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0 14px;}
  .rev h3{margin:0 0 8px;font-size:1.05rem;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chips span{direction:ltr;background:var(--warn-soft);border:1.5px solid #F1D79A;border-radius:12px;padding:6px 10px;font-family:'Fredoka','Heebo',sans-serif;font-weight:600;font-size:1.15rem;}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .ghost{width:100%;border:2px solid var(--line);background:var(--card);border-radius:18px;font-size:1.1rem;font-weight:700;padding:14px;color:var(--ink);}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
</style>
</head>
<body>
<div class="app">

  <!-- פתיחה -->
  <section class="scr on" id="sHome">
    <div class="hi">
      <div class="big">✖️➗</div>
      <h1>לוח הכפל</h1>
      <p id="hiName">20 תרגילים, ואז ציון!</p>
    </div>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-m="mul"><span class="ic">✖️</span>כפל</button>
      <button type="button" class="mode" data-m="div"><span class="ic">➗</span>חילוק</button>
      <button type="button" class="mode" data-m="mix"><span class="ic">🔀</span>גם וגם</button>
    </div>
    <button type="button" class="go" id="goBtn">יאללה, מתחילים!</button>
    <div class="best" id="best"></div>
    <div class="miss-note" id="missNote"></div>
  </section>

  <!-- תרגיל -->
  <section class="scr" id="sQ">
    <div class="top"><span class="cnt" id="cnt">1 / 20</span><div class="dots" id="dots"></div></div>
    <div class="qwrap">
      <div class="eq" id="eq"></div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" class="del" data-k="del" aria-label="מחיקה">⌫</button><button type="button" data-k="0">0</button><button type="button" class="chk" data-k="ok" id="chk" aria-label="בדיקה">✓</button>
    </div>
    <button type="button" class="next" id="nextBtn">הבא ←</button>
  </section>

  <!-- סוף -->
  <section class="scr" id="sEnd">
    <div class="end" id="endBox"></div>
  </section>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const H=new URLSearchParams(location.hash.slice(1));
  const NAME=H.get('p')||'', PID=H.get('pid')||'aviv';
  const K_MISS='tm_kefel_miss_'+PID, K_HIST='tm_kefel_hist_'+PID, K_MODE='tm_kefel_mode_'+PID;
  const lg=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const ls=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const jget=(k,d)=>{ try{ return JSON.parse(lg(k))||d; }catch(e){ return d; } };
  const N=20;

  /* ---------- צלילים קטנים ---------- */
  let AC=null;
  function tone(f,d,t){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,AC.currentTime+t); g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);
    o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+d+.05); }catch(e){} }
  const sndOk=()=>{ tone(660,.12,0); tone(880,.18,.1); };
  const sndBad=()=>{ tone(240,.22,0); };

  /* ---------- בניית סבב ---------- */
  const rnd=n=>Math.floor(Math.random()*n);
  /* רוב התרגילים עם 2–9; מדי פעם 1 או 10 (הם קלים) */
  function factor(){ return Math.random()<0.88 ? 2+rnd(8) : (Math.random()<.5?1:10); }
  const keyOf=q=>q.op==='m'?('m:'+q.a+'x'+q.b):('d:'+q.a*q.b+'/'+q.a);
  function mk(op,a,b){ return {op,a,b}; }                 /* כפל: a×b · חילוק: (a×b)÷a = b */
  function fromKey(k){ const m=k.match(/^m:(\d+)x(\d+)$/); if(m) return mk('m',+m[1],+m[2]);
    const d=k.match(/^d:(\d+)\/(\d+)$/); if(d){ const a=+d[2]; return mk('d',a,(+d[1])/a); } return null; }
  function shuffle(L){ for(let i=L.length-1;i>0;i--){ const j=rnd(i+1); [L[i],L[j]]=[L[j],L[i]]; } return L; }
  function build(mode){
    const ops = mode==='mul' ? Array(N).fill('m') : mode==='div' ? Array(N).fill('d') : shuffle(Array(N/2).fill('m').concat(Array(N/2).fill('d')));
    const used=new Set(), out=Array(N).fill(null);
    /* טעויות מסבבים קודמים חוזרות קודם (עד 8) */
    const miss=jget(K_MISS,{}); const mk_=Object.keys(miss).filter(k=>miss[k]>0).sort((x,y)=>miss[y]-miss[x]);
    let placed=0;
    for(const k of mk_){ if(placed>=8) break; const q=fromKey(k); if(!q) continue;
      const i=ops.findIndex((o,ix)=>o===q.op&&!out[ix]); if(i<0) continue; out[i]=q; used.add(keyOf(q)); placed++; }
    let ones=0, guard=0;
    for(let i=0;i<N;i++){ if(out[i]) continue;
      let q; do{ q=mk(ops[i],factor(),factor()); guard++; }
      while(guard<5000&&(used.has(keyOf(q))||((q.a===1||q.b===1||q.a===10||q.b===10)&&ones>=3)));
      if(q.a===1||q.b===1||q.a===10||q.b===10) ones++;
      used.add(keyOf(q)); out[i]=q; }
    return shuffle(out);
  }
  const answer=q=>q.op==='m'?q.a*q.b:q.b;
  function eqHtml(q,val,cls){
    const box='<span class="ans '+(cls||'')+'">'+(val===''?'&nbsp;':val)+'</span>';
    return q.op==='m' ? '<span>'+q.a+'</span><span class="op">×</span><span>'+q.b+'</span><span class="op">=</span>'+box
                      : '<span>'+(q.a*q.b)+'</span><span class="op">÷</span><span>'+q.a+'</span><span class="op">=</span>'+box;
  }
  const lt=s=>'<span class="why">'+s+'</span>';
  function hint(q){
    const {a,b}=q;
    if(q.op==='m'){
      if(a===1||b===1) return 'כפול 1 — המספר נשאר אותו דבר';
      if(a===10||b===10) return 'כפול 10 — מוסיפים 0 בסוף';
      if(b===2) return 'כפול 2 = פעמיים: '+lt(a+' + '+a);
      if(a===2) return 'כפול 2 = פעמיים: '+lt(b+' + '+b);
      if(b===5) return 'רמז: '+lt(a+' × 10 = '+(a*10))+' ועכשיו חצי';
      if(a===5) return 'רמז: '+lt(b+' × 10 = '+(b*10))+' ועכשיו חצי';
      return 'רמז: '+lt(a+' × '+(b-1)+' = '+(a*(b-1)))+' ועוד '+a;
    }
    if(a===1) return 'חלקי 1 — המספר נשאר אותו דבר';
    return 'רמז: '+lt(a+' × ? = '+(a*b));
  }
  const fact=q=>q.op==='m'?(q.a+' × '+q.b+' = '+q.a*q.b):((q.a*q.b)+' ÷ '+q.a+' = '+q.b);

  /* ---------- מצב ---------- */
  let mode=lg(K_MODE)||'mix', Q=[], i=0, val='', tries=0, res=[], t0=0, busy=false;

  function paintModes(){ document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===mode)); }
  function home(){
    paintModes();
    if(NAME) $('hiName').textContent='היי '+NAME+'! 20 תרגילים, ואז ציון 💪';
    const H=jget(K_HIST,[]);
    if(H.length){ const best=Math.max.apply(null,H.map(h=>h.g)), last=H[H.length-1];
      $('best').innerHTML='ציון אחרון: <b>'+last.g+'</b> · הכי גבוה: <b>'+best+'</b>'+(best===100?' 🏆':''); }
    else $('best').textContent='';
    const miss=jget(K_MISS,{}), n=Object.keys(miss).filter(k=>miss[k]>0).length;
    $('missNote').textContent=n?('🎯 '+(n>8?8:n)+' תרגילים שהיו קשים יחזרו בסבב'):'';
    show('sHome');
  }
  function show(id){ document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id)); }
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; ls(K_MODE,mode); paintModes(); });
  $('goBtn').onclick=start;

  function start(){
    Q=build(mode); i=0; res=[]; t0=Date.now();
    $('dots').innerHTML=Array(N).fill('<i></i>').join('');
    show('sQ'); ask();
  }
  function ask(){
    val=''; tries=0; busy=false;
    $('cnt').textContent=(i+1)+' / '+N;
    [...$('dots').children].forEach((d,k)=>{ d.classList.toggle('now',k===i); });
    $('fb').className='fb'; $('fb').innerHTML='';
    $('nextBtn').classList.remove('on'); $('pad').style.display='';
    draw();
  }
  function draw(cls){ $('eq').innerHTML=eqHtml(Q[i],val,cls); $('chk').disabled=!val; }

  function key(k){
    if(busy) return;
    if(k==='del'){ val=val.slice(0,-1); draw(); return; }
    if(k==='ok'){ if(val) check(); return; }
    if(val.length>=3) return;
    if(val==='0') val='';
    val+=k; draw();
  }
  $('pad').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) key(b.dataset.k); });
  document.addEventListener('keydown',e=>{
    if(!$('sQ').classList.contains('on')) return;
    if(/^[0-9]$/.test(e.key)) key(e.key);
    else if(e.key==='Backspace') key('del');
    else if(e.key==='Enter'){ if($('nextBtn').classList.contains('on')) next(); else key('ok'); }
  });

  function check(){
    const q=Q[i], ok=(+val===answer(q)); tries++;
    if(ok){
      busy=true; sndOk(); draw('ok');
      const pts=tries===1?5:3; res[i]={q,pts,first:tries===1};
      const why=q.op==='d'?'<small>כי '+lt(q.a+' × '+q.b+' = '+q.a*q.b)+'</small>':'';
      $('fb').className='fb ok'; $('fb').innerHTML=(tries===1?['מעולה! ✓','נכון! ✓','יופי! ✓','בול! ✓'][rnd(4)]:'נכון! הצלחת בפעם השנייה ✓')+why;
      mark(tries===1?'ok':'half');
      remember(q,tries===1);
      setTimeout(next,q.op==='d'?1300:900);
      return;
    }
    sndBad(); draw('bad');
    if(tries===1){
      $('fb').className='fb hint'; $('fb').innerHTML='כמעט! נסי שוב<small>'+hint(q)+'</small>';
      setTimeout(()=>{ val=''; draw(); },650);
      return;
    }
    busy=true; res[i]={q,pts:0,first:false};
    $('fb').className='fb bad'; $('fb').innerHTML='<span>התשובה: '+lt(fact(q))+'</span><small>התרגיל יחזור בסבב הבא 🎯</small>';
    mark('bad'); remember(q,false);
    $('pad').style.display='none'; $('nextBtn').classList.add('on');
  }
  function mark(c){ const d=$('dots').children[i]; if(d){ d.classList.remove('now'); d.classList.add(c); } }
  function remember(q,firstOk){
    const m=jget(K_MISS,{}), k=keyOf(q);
    if(firstOk){ if(m[k]){ m[k]--; if(m[k]<=0) delete m[k]; } }
    else m[k]=2;          /* צריך לענות נכון פעמיים מהפעם הראשונה כדי שייצא */
    ls(K_MISS,JSON.stringify(m));
  }
  $('nextBtn').onclick=next;
  function next(){ if(i<N-1){ i++; ask(); } else finish(); }

  function finish(){
    const g=res.reduce((s,r)=>s+(r?r.pts:0),0), first=res.filter(r=>r&&r.first).length;
    const sec=Math.round((Date.now()-t0)/1000), tm=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
    const H=jget(K_HIST,[]); const prevBest=H.length?Math.max.apply(null,H.map(h=>h.g)):-1;
    H.push({g,first,sec,mode,at:Date.now()}); ls(K_HIST,JSON.stringify(H.slice(-30)));
    const msg=g===100?'מושלם! 🏆':g>=90?'מצוין! 🌟':g>=75?'יפה מאוד! 👏':g>=60?'יפה! עוד קצת תרגול 💪':'בואי נתרגל עוד 💪';
    const wrong=res.filter(r=>r&&!r.first).map(r=>r.q);
    const C=2*Math.PI*64, col=g>=90?'#2F9E5B':g>=60?'#0B6F6B':'#B7791F';
    $('endBox').innerHTML=
      '<div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="#E7DFCC" stroke-width="12"/>'+
      '<circle id="arc" cx="75" cy="75" r="64" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1.1s ease"/></svg>'+
      '<div class="g"><b id="gNum">0</b><span>ציון</span></div></div>'+
      '<h2>'+msg+'</h2>'+
      (g>prevBest&&prevBest>=0?'<div style="color:var(--ok);font-weight:800">🎉 שיא חדש!</div>':'')+
      '<div class="stats"><div>✓ <b>'+first+'</b> מתוך 20 בפעם הראשונה</div><div>⏱️ <b>'+tm+'</b></div></div>'+
      (wrong.length?'<div class="rev"><h3>🎯 כדאי לחזור על:</h3><div class="chips">'+wrong.map(q=>'<span>'+fact(q)+'</span>').join('')+'</div></div>':'<div class="rev"><h3>🙌 כל התרגילים נכונים מהפעם הראשונה!</h3></div>')+
      '<div class="btns"><button type="button" class="go" id="again">🔁 עוד סבב</button><button type="button" class="ghost" id="toHome">סיום</button></div>';
    show('sEnd');
    requestAnimationFrame(()=>setTimeout(()=>{ const a=$('arc'); if(a) a.style.strokeDashoffset=C*(1-g/100); },60));
    let n=0; const st=Math.max(1,Math.round(g/25)); const iv=setInterval(()=>{ n=Math.min(g,n+st); $('gNum').textContent=n; if(n>=g) clearInterval(iv); },30);
    if(g>=90) confetti();
    $('again').onclick=start;
    $('toHome').onclick=()=>{ try{ parent.postMessage({tm:'kefelClose'},'*'); }catch(e){} home(); };
    try{ parent.postMessage({tm:'kefelDone',pid:PID,grade:g,first,sec,mode},'*'); }catch(e){}
  }
  function confetti(){
    const c=document.createElement('div'); c.className='confetti'; const cols=['#0B6F6B','#F6C445','#EF6F6C','#3FA79A','#8E7CC3'];
    for(let k=0;k<40;k++){ const p=document.createElement('i'); p.style.left=rnd(100)+'%'; p.style.background=cols[k%5]; p.style.animationDelay=(Math.random()*.8)+'s'; c.appendChild(p); }
    document.body.appendChild(c); setTimeout(()=>c.remove(),3500);
  }
  home();
})();
</script>
</body>
</html>
